<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b693d"/>
      <stop offset="100%" style="stop-color:#00ca41"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Abstract circles -->
  <circle cx="680" cy="80" r="160" fill="white" opacity="0.06"/>
  <circle cx="100" cy="520" r="200" fill="white" opacity="0.05"/>
  <!-- Running shoe -->
  <g transform="translate(180, 160)" fill="white" opacity="0.92">
    <!-- Sole -->
    <ellipse cx="220" cy="290" rx="210" ry="28" fill="white" opacity="0.3"/>
    <!-- Main shoe body -->
    <path d="M40 260 Q60 180 140 160 Q220 140 310 155 Q370 163 400 185 Q420 200 415 230 Q410 255 390 265 L60 275 Q45 270 40 260Z" fill="white"/>
    <!-- Toe cap -->
    <path d="M40 260 Q30 250 35 235 Q45 210 80 200 Q120 192 140 200 Q155 208 155 225 Q155 248 140 260Z" fill="white" opacity="0.7"/>
    <!-- Laces -->
    <line x1="160" y1="195" x2="370" y2="180" stroke="#1b693d" stroke-width="6" stroke-linecap="round"/>
    <line x1="165" y1="210" x2="375" y2="196" stroke="#1b693d" stroke-width="5" stroke-linecap="round"/>
    <line x1="170" y1="225" x2="380" y2="212" stroke="#1b693d" stroke-width="4" stroke-linecap="round"/>
    <!-- Heel tab -->
    <rect x="380" y="175" width="35" height="80" rx="10" fill="white" opacity="0.8"/>
    <!-- Swoosh-like accent -->
    <path d="M80 230 Q180 200 340 210" stroke="#00ca41" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Small dumbbell -->
  <g transform="translate(530, 320)" fill="white" opacity="0.5">
    <rect x="0" y="18" width="120" height="14" rx="7"/>
    <rect x="-10" y="5" width="22" height="40" rx="8"/>
    <rect x="108" y="5" width="22" height="40" rx="8"/>
  </g>
  <!-- Small football -->
  <circle cx="620" cy="200" r="50" fill="white" opacity="0.12"/>
  <circle cx="620" cy="200" r="50" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  <!-- Speed lines -->
  <line x1="50" y1="320" x2="150" y2="320" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.2"/>
  <line x1="30" y1="345" x2="130" y2="345" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
  <line x1="60" y1="370" x2="140" y2="370" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.1"/>
</svg>
